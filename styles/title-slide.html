<section id="$idprefix$title-slide" class="quarto-title-block"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  <h1 class="title">$display-title$</h1>
  <p class="subtitle">$subtitle$</p>
  <div class="title-footer">
    <div class="quarto-title-authors">
$for(by-author)$
      <p class="quarto-title-author">$by-author.name.literal$</p>
$endfor$
    </div>
  </div>
</section>
