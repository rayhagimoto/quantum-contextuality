project:
  type: default
  render:
    - index.qmd
  output-dir: _site
  resources:
    # Anchor paths so Quarto does not search the project tree for each resource.
    - /assets/measurement-line.html
    - /assets/measurement-line.css
    - /assets/measurement-conveyor.js
    - /assets/measurement-line.js
    - /assets/measurement-line-navigation.js
    - /assets/property-table.js
    - /assets/property-table.css
    - /assets/empirical-lab-prototype.js
    - /assets/empirical-lab-prototype.css
    - /assets/empirical-runs.json
    - /assets/classical-products.js
    - /assets/opening.js
    - /assets/crt-screen.css
    - /assets/device-prototype.css
    - /assets/recurrent-model/
    - /assets/cat-sprites/
    - /assets/cat-scribbling/sprite-sheet-stress-loops.png
    - /assets/cat-scribbling/sprite-sheet-recovery.png
    - /assets/cat-scribbling/sleep-exhaled.png
    - /assets/cat-scribbling/sleep-mid-inhale.png
    - /assets/cat-scribbling/sleep-full-inhale.png
    - /assets/sign-game.html
    - /assets/proof-square.js
    - /assets/proof-math.css
    - /assets/vendor/proof-math.js
    - /assets/presentation-theme.js
    - /assets/sign-glyphs.js
    - /assets/quantum-measurements.mjs
    - /assets/fonts/
    - /assets/figures/
    - /assets/career-qr.js
    - /assets/infleqtion-role-qr.svg
    - /assets/portfolio/
    - /assets/about-infleqtion-2026/
    - /assets/katex-init.js
    - /assets/vendor/katex/
    - /assets/math.css
    - /assets/layout.css
    - /assets/themes/infleqtion/

brand: assets/themes/infleqtion/brand.yml

filters:
  - assets/katex-math.lua

format:
  revealjs:
    logo:
      path: assets/themes/infleqtion/logo-rgb-color.svg
      alt: Infleqtion
    theme: simple
    html-math-method: plain
    template-partials:
      - styles/title-slide.html
    css: styles/presentation.css
    include-in-header:
      text: |
        <link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
        <script defer src="assets/vendor/katex/katex.min.js"></script>
        <script defer src="assets/vendor/katex/contrib/auto-render.min.js"></script>
        <script defer src="assets/katex-init.js"></script>
        <script src="assets/presentation-theme.js"></script>
        <script defer src="assets/opening.js"></script>
        <script defer src="assets/career-qr.js"></script>
        <link rel="stylesheet" href="assets/proof-math.css">
        <script defer src="assets/vendor/proof-math.js"></script>
        <link rel="stylesheet" href="assets/property-table.css">
        <script defer src="assets/property-table.js"></script>
    width: 1920
    height: 1080
    margin: 0.1
    max-scale: 1
    transition: fade
    slide-number: true
    controls: true
    navigation-mode: linear
    progress: true
    preload-iframes: true

